<div class="manLoginDiv">
    <div class="login-box">
        <form action="#">
            <h2>Login</h2>
            <div style="text-align: center;"><span *ngIf="login.general" class="danger"> {{ login.general }} </span> </div>
            <div class="input-box">
                <span class="icon">
                    <i class="fa fa-envelope"></i>
                </span>
                <input type="email" [(ngModel)]="login.email" name="email" required [ngClass]="{'invalid': login.email_message}">
                <label>Email</label>
                <br>
                <span *ngIf="login.email_message" class="danger"> {{ login.email_message }} </span>
            </div>
            <div class="input-box">
                <span class="icon">
                    <i class="fa fa-lock"></i>
                </span>
                <input type="password" [(ngModel)]="login.password" name="password" required [ngClass]="{'invalid': login.password_message}">
                <label>Password</label>
                <br>
                <span *ngIf="login.password_message" class="danger"> {{ login.password_message }} </span>
            </div>
            <div class="remember-forgot">
                <label>
                    <input type="checkbox"> Remember me
                </label>
                <a href="#">Forgot password?</a>
            </div>
            <button type="button" (click)="onLogin()">Login</button>
            <div class="link">
                <p>
                    Don't have an account?
                    <a href="#">Register</a>
                </p>
            </div>
        </form>
    </div>
</div>
