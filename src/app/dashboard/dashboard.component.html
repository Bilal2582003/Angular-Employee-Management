<div class="row main">

    <div class="projec-main col-lg-5 col-md-6 col-sm-10 col-10 m-2 mx-auto">
        <div class="card">
            <div class="card-header">Project</div>
            <div class="card-body projectdivBody">
                <h3>{{ project.totalForShow }}</h3>
                <div class="dropdown">
                    <span>{{project.selectedType}}</span>
                    <div class="dropdown-content">
                        <p (click)="changeType('All')" [class.selected]="project.selectedType === 'All'">All</p>
                        <p *ngFor="let type of project.TypeList" (click)="changeType(type)"
                            [class.selected]="type === project.selectedType">
                            {{ type }}
                        </p>
                    </div>
                </div>
            </div>
            <!-- <div class="card-footer"></div> -->
        </div>
    </div>
    <div class="employee-main col-lg-5 col-md-6 col-sm-10 col-10 m-2 mx-auto">
        <div class="card">
            <div class="card-header">Employee</div>
            <div class="card-body">
                <h3>{{ employee.total }}</h3>
            </div>
            <!-- <div class="card-footer"></div> -->
        </div>
    </div>

</div>
